name: Tarea
description: "Un átomo (ADR-0033): un PR que entrega algo comprobable y cabe en una revisión tranquila (del orden de 200 a 400 líneas de producción). Si se puede partir en dos piezas que entregan algo cada una, se parte."
labels: ["tipo:tarea"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué hay que hacer.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Cómo sabemos que está terminada.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      description: "Cómo se trabaja (ADR-0014). Dirigido: el autor explica el flujo y Claude lo escribe. Propuesto: Claude propone y el autor aprueba. Al refinar se agrega el label modo:dirigido o modo:propuesto."
      options:
        - dirigido
        - propuesto
    validations:
      required: true
  - type: input
    id: adrs
    attributes:
      label: ADRs
      description: Uno o varios. El primero es el dueño, y su área da el label área:. Las dependencias se marcan en Relationships → Mark as blocked by.
      placeholder: ADR-0007, ADR-0022
  - type: textarea
    id: explicar
    attributes:
      label: Qué debo poder explicar
      description: Preguntas que haría un evaluador sobre este trabajo. La tarea no se cierra hasta que el autor pueda responderlas. Si el flujo tiene diagrama (ADR-0030), se responden recorriéndolo.
    validations:
      required: true
