name: Tarea
description: Trabajo que se termina en 1 a 3 sesiones, con criterios de aceptación claros. Si no cabe, se parte.
labels: ["tipo:tarea"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué hay que hacer.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Cómo sabemos que está terminada.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      description: Quién escribe el código (regla B en CLAUDE.md). Al refinar se agrega el label owner:autor u owner:claude.
      options:
        - autor
        - claude
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: ADR relacionado
      placeholder: ADR-0005
  - type: textarea
    id: explicar
    attributes:
      label: Qué debo poder explicar
      description: Preguntas que haría un evaluador sobre este trabajo. Obligatoria si el owner es autor; la tarea no se cierra hasta poder responderlas.
