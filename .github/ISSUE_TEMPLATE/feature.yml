name: Feature
description: Una capacidad concreta (por ejemplo "Shadow maps"). Va como sub-issue de una épica y se parte en tareas.
labels: ["tipo:feature"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué capacidad se agrega y por qué.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Cómo sabemos que está terminada.
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: modo
    attributes:
      label: Modo
      description: "Cómo se trabaja (ADR-0014). Dirigido: el autor explica el flujo y Claude lo escribe. Propuesto: Claude propone y el autor aprueba. Al refinar se agrega el label modo:dirigido o modo:propuesto."
      options:
        - dirigido
        - propuesto
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: ADR relacionado
      placeholder: ADR-0005
  - type: textarea
    id: explicar
    attributes:
      label: Qué debo poder explicar
      description: Preguntas que haría un evaluador sobre este trabajo. La feature no se cierra hasta que el autor pueda responderlas.
    validations:
      required: true
