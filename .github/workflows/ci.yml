# La CI de cada PR hacia main y de cada push a main.
#
# Los jobs corren en el contenedor archlinux:latest con los repositorios congelados en la
# fecha de tools/ci/archive-date: el mismo toolchain que la máquina del autor. Cada job
# solo llama a un script de tools/ci/, que en local corre igual, con la misma fecha:
#
#   tools/ci/run.sh <job>
#
# Antes de instalar, cada job restaura dos cachés con la fecha en la clave: los paquetes
# (/var/cache/pacman/pkg, que también dependen de las listas) y las bases de datos de los
# repositorios (/var/lib/pacman/sync). Con las dos, un job no le pide nada al Arch Linux
# Archive, que a veces no responde.
#
# El único chequeo obligatorio de "Proteger main" es ci-ok. Lo que no hace falta en un
# PR se salta con un if: según lo que decide el job changes, nunca con paths:.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior del mismo PR. En main no: cada commit
# de main se prueba entero. Por eso cada push tiene su propio grupo (su SHA): en un grupo
# compartido, una corrida nueva cancela a la que espera aunque cancel-in-progress sea
# false.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Qué cambió el PR. Corre en el runner, sin contenedor: solo necesita git.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: tools/ci/changes.sh "$BASE" "$HEAD" >>"$GITHUB_OUTPUT"

  # Etapa rápida, chequeos del C++: solo si el PR toca código.
  fast-cpp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: [format, cpp-subset]
    steps:
      # Sin git en el contenedor, checkout baja un tarball del commit: alcanza para leer
      # la fecha y las listas de paquetes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      # Con git ya instalado, un clon real en lugar del tarball: los scripts usan
      # git ls-files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          JOB: ${{ matrix.job }}
        run: bash "tools/ci/$JOB.sh"

  # Etapa rápida, chequeos de todo el repo: corren siempre.
  fast-repo:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        job: [reuse, actionlint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          JOB: ${{ matrix.job }}
        run: bash "tools/ci/$JOB.sh"

  # En paralelo con la etapa rápida: el Blender de tools/ci/blender-version, desde su
  # tarball oficial y verificado con su sha256, corre sin interfaz y es esa versión. Solo
  # si el PR toca código. La carpeta instalada va a la caché con el pin como clave:
  # cambiar la versión o el sha256 la invalida. La segunda etapa lo espera, porque su
  # configuración exporta los .blend (cmake/mz_blender.cmake): así Blender se baja y se
  # guarda en la caché una sola vez por pin, y nada compila si Blender está roto.
  blender:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    env:
      MZ_TOOLS_DIR: /opt/mz-tools
    steps:
      # El tarball del commit alcanza: blender.sh no usa git, así que no hace falta el
      # clon real de los otros jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/mz-tools/blender-*
          key: blender-${{ hashFiles('tools/ci/blender-version') }}
      - run: bash tools/ci/blender.sh

  # Segunda etapa: arranca solo si la rápida pasó, y solo si el PR toca código. Cada
  # entrada de la matriz es un workflow preset de CMakePresets.json (build.sh <preset>):
  # debug con Clang y debug con GCC compilan y corren los tests, con ASan, UBSan y LSan;
  # relwithdebinfo y release solo compilan. Los warnings son errores en los cuatro.
  # Como coverage y clang-tidy, restaura el Blender que dejó en la caché el job blender:
  # la configuración lo necesita para exportar los .blend.
  build:
    needs: [changes, fast-cpp, fast-repo, blender]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    env:
      MZ_TOOLS_DIR: /opt/mz-tools
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, debug-gcc, relwithdebinfo, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/mz-tools/blender-*
          key: blender-${{ hashFiles('tools/ci/blender-version') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          PRESET: ${{ matrix.preset }}
        run: bash tools/ci/build.sh "$PRESET"

  # Segunda etapa: la cobertura con la meta del 100 % en líneas y ramas, en las carpetas
  # de tests/CMakeLists.txt. Falla si queda algo sin cubrir, y el resumen del
  # job dice qué. El reporte HTML se sube como artefacto también si falla, que es cuando
  # hace falta revisarlo.
  coverage:
    needs: [changes, fast-cpp, fast-repo, blender]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    env:
      MZ_TOOLS_DIR: /opt/mz-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/mz-tools/blender-*
          key: blender-${{ hashFiles('tools/ci/blender-version') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/coverage.sh
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: |
            build/coverage/coverage/html
            build/coverage/coverage/summary.txt
          retention-days: 14

  # Segunda etapa: clang-tidy sobre engine/, game/ y tests/, con la configuración de
  # .clang-tidy, donde cada hallazgo es un error. Solo configura, para tener la base de
  # compilación: no compila.
  clang-tidy:
    needs: [changes, fast-cpp, fast-repo, blender]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 15
    env:
      MZ_TOOLS_DIR: /opt/mz-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('tools/ci/archive-date', 'tools/ci/toolchain.txt', 'tools/ci/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/lib/pacman/sync
          key: pacman-sync-${{ hashFiles('tools/ci/archive-date') }}
      - run: bash tools/ci/install.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/mz-tools/blender-*
          key: blender-${{ hashFiles('tools/ci/blender-version') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tools/ci/clang-tidy.sh

  # El único chequeo obligatorio. Corre siempre, también si la corrida se cancela, y
  # falla si algún job falló o se canceló. Un job saltado por su if: cuenta como éxito.
  # Agregar un job es sumarlo a needs, sin tocar el ruleset. No llama a un script porque
  # no hay nada que repetir en local: solo lee los resultados de GitHub.
  ci-ok:
    needs: [changes, fast-cpp, fast-repo, blender, build, coverage, clang-tidy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
